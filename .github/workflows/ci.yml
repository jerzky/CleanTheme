name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    # WPF only builds on Windows.
    name: Build, test, pack
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build CleanTheme.slnx --configuration Release

      - name: Test
        run: dotnet test CleanTheme.slnx --configuration Release --no-build

      # Catches packaging mistakes before a release tag does. Publishing happens in publish.yml.
      - name: Pack
        run: dotnet pack CleanTheme.slnx --configuration Release --no-build --output packages
